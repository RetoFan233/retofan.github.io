<!DOCTYPE html>
<html lang="en">
<!-- Template: https://github.com/luost26/academic-homepage -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>
    <meta name="description" content="{{ site.data.profile.short_bio | strip_html | strip_newlines | truncate: 160 }}">
    <meta name="theme-color" content="#f5f4ed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{ '/assets/images/etc/favicon.svg' | relative_url }}" type="image/svg+xml">

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }} - {{ site.data.profile.navbar_name }}">
    <meta property="og:description" content="{{ site.data.profile.short_bio | strip_html | strip_newlines | truncate: 160 }}">
    <meta property="og:image" content="{{ site.data.profile.portrait_url | absolute_url }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">

    <!-- Apply saved theme before first paint to avoid flashing -->
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg==" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body class="bg-light" {{ page.body_attr }}>

    <a class="skip-link" href="#main">Skip to content</a>

    {% include navbar.html %}
    <main id="main" class="container">
        {{content}}
    </main>
    {% include footer.html %}

    <button class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Scripts: no jQuery / Bootstrap JS / Popper. Interactions are vanilla JS,
         images use native loading="lazy". -->
    <script src="{{ '/assets/js/common.js' | relative_url }}" defer></script>
</body>
</html>
